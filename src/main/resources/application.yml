spring:
  application:
    name: rwm-backend
  datasource:
    url: ${RWM_DB_URL}
    username: ${RWM_DB_USERNAME}
    password: ${RWM_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

rwm:
  cors:
    allowed-origins: ${RWM_CORS_ALLOWED_ORIGINS}
  security:
    jwt:
      issuer: ${RWM_JWT_ISSUER}
      secret: ${RWM_JWT_SECRET}
      expiration-minutes: ${RWM_JWT_EXPIRATION_MINUTES}
